<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسالة لك</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#9b7fc7; /* متغير واحد يغيّر الموقع كله (يُضبط من CONFIG.accent) */
  --p:var(--accent);
  --l:color-mix(in srgb,var(--accent) 22%,#fff);
  --d:color-mix(in srgb,var(--accent) 62%,#000);
  --bg:color-mix(in srgb,var(--accent) 10%,#fff);
  --t:color-mix(in srgb,var(--accent) 22%,#000);
  --ar:'Amiri','Noto Naskh Arabic',serif; --ui:'Tajawal',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--t);overflow:hidden;
  background:linear-gradient(160deg,var(--bg),var(--l) 55%,color-mix(in srgb,var(--p) 55%,#fff));
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.stage.on{opacity:1;visibility:visible;transition:opacity .9s ease}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--d);outline-offset:3px}

/* بتلات */
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pt{display:block;width:100%;height:100%;background:linear-gradient(135deg,var(--l),var(--p));border-radius:100% 0 100% 0}
.fall{position:absolute;top:0;opacity:.55;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-12vh,0) rotate(0)}to{transform:translate3d(var(--sx),112vh,0) rotate(var(--r))}}

/* القفل */
.card{width:min(92vw,360px);padding:34px 24px 26px;text-align:center;border-radius:26px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px color-mix(in srgb,var(--d) 25%,transparent)}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lock{width:68px;height:68px;margin:0 auto 14px;display:block;overflow:visible}
.lock .sh{fill:none;stroke:var(--d);stroke-width:5;stroke-linecap:round;transform-box:fill-box;transform-origin:right bottom;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.lock.open .sh{transform:translateY(-7px) rotate(28deg)}
.lock .bd{fill:var(--p)}.lock .kh{fill:#fff}
.card h1{font:700 22px/1.6 var(--ar);margin-bottom:16px}
.field{display:flex;align-items:center;background:#fff;border:1.5px solid var(--l);border-radius:14px;padding:0 6px 0 12px}
.field:focus-within{border-color:var(--p)}
.field input{flex:1;min-width:0;border:0;background:none;padding:14px 4px;font:inherit;font-size:16px;color:var(--t);outline:0;text-align:center;direction:ltr}
.eye{border:0;background:none;width:40px;height:40px;display:grid;place-items:center}
.eye svg{width:22px;height:22px;stroke:var(--d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--d));color:#fff;font-size:17px;font-weight:500;transition:transform .2s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.5}
#err{min-height:24px;margin-top:10px;font-size:14px;color:#b0405f}
#hint{font-size:13px;opacity:.7}

/* الظرف */
.wrap{text-align:center}
.scene{--w:min(80vw,320px);width:var(--w);height:calc(var(--w)*.66);position:relative;margin:70px auto 26px;perspective:900px;cursor:pointer;transition:opacity .8s,transform .8s}
.scene.gone{opacity:0;transform:translateY(40px)}
.scene>*{position:absolute}
.eb{inset:0;border-radius:8px;background:linear-gradient(160deg,var(--p),var(--d));box-shadow:0 18px 40px color-mix(in srgb,var(--d) 35%,transparent)}
.paper{left:6%;right:6%;top:7%;bottom:5%;background:#fff;border-radius:4px;z-index:2;transition:transform 1s cubic-bezier(.3,.8,.3,1);
  background-image:repeating-linear-gradient(#fff 0 14px,var(--l) 14px 15px);background-size:70% 100%;background-repeat:no-repeat;background-position:center}
.scene.up .paper{transform:translateY(-52%)}
.front{inset:0;z-index:3;border-radius:8px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);background:linear-gradient(180deg,color-mix(in srgb,var(--p) 80%,#fff),var(--p))}
.flap{left:0;right:0;top:0;height:58%;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;background:linear-gradient(180deg,var(--d),var(--p));transition:transform .9s cubic-bezier(.4,.2,.2,1),z-index 0s .45s}
.scene.open .flap{transform:rotateX(180deg);z-index:1}
.seal{left:50%;top:58%;width:56px;height:56px;margin:-28px -28px 0 0;z-index:5;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--p) 70%,#fff),var(--d));box-shadow:0 4px 10px rgba(0,0,0,.25);transition:opacity .4s}
.seal svg{width:26px;height:26px;fill:#fff}
.scene.pulse .seal{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.28)}70%{transform:scale(.92)}}
.scene.open .seal{opacity:0}
.tap{font:700 20px var(--ar);transition:opacity .6s;animation:blink 2.4s ease-in-out infinite}
.tap.gone{opacity:0;animation:none}
@keyframes blink{50%{opacity:.45}}

/* الورقة */
.sheetwrap{z-index:10}
.sheet{position:relative;width:min(92vw,480px);max-height:84dvh;display:flex;flex-direction:column;background:#fffdfb;border-radius:8px;
  box-shadow:0 24px 60px color-mix(in srgb,var(--d) 35%,transparent);transform:translateY(60px) scale(.6);opacity:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .9s}
.sheetwrap.on .sheet{transform:none;opacity:1}
.sheet::before{content:"";height:6px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,var(--l),var(--p),var(--l))}
.scroll{overflow-y:auto;padding:38px 26px 32px;-webkit-overflow-scrolling:touch}
.x{position:absolute;top:14px;left:12px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:var(--d);stroke-width:2.2;stroke-linecap:round}
.kicker{direction:ltr;text-align:center;font:500 12px var(--ui);letter-spacing:.38em;color:var(--p)}
.name{text-align:center;font:700 26px/1.6 var(--ar);margin:10px 0 18px;color:var(--d)}
.msg{font:400 20px/2.1 var(--ar)}
.line{white-space:pre-line;min-height:1em;opacity:0;transform:translateY(8px)}
.sheetwrap.on .line{animation:in .9s forwards;animation-delay:calc(var(--i)*.55s + 1s)}
@keyframes in{to{opacity:1;transform:none}}
.sig{margin-top:20px;font:italic 400 22px var(--ar);color:var(--d);text-align:left;opacity:0}
.sheetwrap.on .sig{animation:in .9s forwards;animation-delay:calc(var(--n)*.55s + 1.4s)}

.bit{position:fixed;left:50%;top:50%;pointer-events:none;z-index:20}
.bit svg{width:100%;height:100%;fill:var(--p)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
  .line,.sig{opacity:1;transform:none}#petals{display:none}
}

#studio{place-items:start center;overflow-y:auto}
.adm{text-align:start;margin:12px auto;width:min(94vw,460px)}
.adm h1{text-align:center}
.adm label{display:block;margin:12px 0 5px;font-weight:500;font-size:14px}
.in{width:100%;padding:12px;border:1.5px solid var(--l);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--t);outline:0}
.in:focus{border-color:var(--p)}
textarea.in{min-height:140px;line-height:1.9;resize:vertical}
.sws{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw.sel{outline:3px solid var(--d);outline-offset:2px}
#cc{width:40px;height:40px;border:0;padding:0;background:none;border-radius:50%}
.row{display:flex;gap:8px;margin-top:10px}.row .go{margin-top:0;font-size:15px;padding:12px 6px}
.go.alt{background:#fff;color:var(--d);border:1.5px solid var(--p)}
#sErr{min-height:22px;margin-top:8px;font-size:14px;color:#b0405f;text-align:center}
.note{font-size:13px;opacity:.75;line-height:1.8;margin-top:10px}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<section class="stage" id="lockStage" aria-label="شاشة القفل">
  <form class="card" id="card" autocomplete="off" onsubmit="return false">
    <svg class="lock" id="lock" viewBox="0 0 64 64" aria-hidden="true">
      <path class="sh" d="M20 30v-9a12 12 0 0 1 24 0v9"/>
      <rect class="bd" x="12" y="28" width="40" height="28" rx="7"/>
      <circle class="kh" cx="32" cy="40" r="4"/><rect class="kh" x="30.5" y="42" width="3" height="8" rx="1.5"/>
    </svg>
    <h1>هذه الرسالة لك وحدك</h1>
    <div class="field">
      <input id="pw" type="password" placeholder="كلمة السر" aria-label="كلمة السر" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="eye" id="eye" aria-label="إظهار كلمة السر">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M4 4l16 16" style="display:none"/></svg>
      </button>
    </div>
    <div id="err" role="alert"></div>
    <button class="go" id="go" type="submit">افتح</button>
    <p id="hint"></p>
  </form>
</section>

<section class="stage" id="envStage" aria-label="الظرف">
  <div class="wrap">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="اضغطي لتفتحي الظرف">
      <div class="eb"></div><div class="paper"></div><div class="front"></div><div class="flap"></div>
      <div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.7 2.7 5 6.2 5c2.1 0 3.8 1.2 5.8 3.4C14 6.2 15.7 5 17.8 5c3.5 0 5.2 3.7 3.8 6.8C19.5 16.4 12 21 12 21z"/></svg></div>
    </div>
    <p class="tap" id="tap">اضغطي لتفتحي الظرف</p>
  </div>
</section>

<section class="stage sheetwrap" id="sheetWrap" aria-label="الرسالة">
  <article class="sheet">
    <button class="x" id="close" aria-label="إغلاق"><svg viewBox="0 0 18 18"><path d="M3 3l12 12M15 3L3 15"/></svg></button>
    <div class="scroll" tabindex="0">
      <div class="kicker">A LETTER FOR YOU</div>
      <div class="name" id="to"></div>
      <div class="msg" id="msg"></div>
      <div class="sig" id="sig"></div>
    </div>
  </article>
</section>

<section class="stage" id="studio" aria-label="لوحة الإنشاء">
  <div class="card adm">
    <h1>أنشئ رسالة سرية</h1>
    <label>اللون</label>
    <div class="sws" id="sws"><input type="color" id="cc" aria-label="لون مخصص"></div>
    <label for="sR">اسم المستلم</label><input class="in" id="sR">
    <label for="sM">الرسالة (كل سطر في سطر)</label><textarea class="in" id="sM"></textarea>
    <label for="sS">التوقيع</label><input class="in" id="sS">
    <label for="sP">كلمة السر</label><input class="in" id="sP" autocomplete="off" spellcheck="false">
    <label for="sH">تلميح (اختياري، يظهر للمستلم)</label><input class="in" id="sH">
    <label for="sU">رابط الموقع بعد رفعه</label><input class="in" id="sU" dir="ltr">
    <button class="go" id="mk" type="button">أنشئ الرابط</button>
    <div id="sErr" role="alert"></div>
    <div id="res" hidden>
      <textarea class="in" id="lnk" readonly dir="ltr" style="min-height:90px;font-size:12px"></textarea>
      <div class="row">
        <button class="go" id="cp" type="button">نسخ</button>
        <button class="go alt" id="wa" type="button">واتساب</button>
        <button class="go alt" id="pv" type="button">معاينة</button>
      </div>
      <p class="note">أرسل كلمة السر بشكل منفصل. الرابط وحده لا يفتح الرسالة، وكلمة السر لا تُحفظ ولا تدخل في الرابط.</p>
    </div>
  </div>
</section>
<div id="fx" aria-hidden="true"></div>

<script>

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CONFIG = {cipher:"", hint:"", accent:"#9b7fc7"};
const COLORS = [["لافندر","#9b7fc7"],["وردي","#c77fa0"],["عنابي","#b5485d"],["سماوي","#5a9bd0"],["نعناعي","#5aa88f"],["خوخي","#e08f6b"],["ذهبي","#c9a14a"],["بنفسجي","#7a5ca8"]];
const b64u = u => { let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };

async function encrypt(text, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text)));
  const all = new Uint8Array(28 + ct.length); all.set(salt,0); all.set(iv,16); all.set(ct,28);
  return b64u(all);
}

/* الرابط: #v1/اللون/التلميح/الرسالة_المشفرة */
const H = location.hash.match(/^#v1\/([0-9a-fA-F]{6})\/([^/]*)\/(.+)$/);
if(H){
  CONFIG.accent = '#' + H[1];
  try{ CONFIG.hint = decodeURIComponent(H[2]); }catch(e){}
  CONFIG.cipher = H[3].replace(/-/g,'+').replace(/_/g,'/');
  document.documentElement.style.setProperty('--accent', CONFIG.accent);
  $('hint').textContent = CONFIG.hint;
  $('lockStage').classList.add('on');
} else {
  initStudio();
}

function setAcc(c){
  CONFIG.accent = c.toLowerCase();
  document.documentElement.style.setProperty('--accent', c);
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('sel', b.dataset.c === CONFIG.accent));
  $('cc').value = CONFIG.accent;
}
function initStudio(){
  $('studio').classList.add('on');
  $('sU').value = location.href.split('#')[0];
  COLORS.forEach(([n,c]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.c = c; b.style.background = c; b.setAttribute('aria-label', n);
    b.onclick = () => setAcc(c); $('sws').insertBefore(b, $('cc'));
  });
  $('cc').oninput = e => setAcc(e.target.value);
  setAcc(CONFIG.accent);
  let link = '';
  $('mk').onclick = async () => {
    const m = $('sM').value.trim(), p = $('sP').value;
    if(!m || !p){ $('sErr').textContent = 'اكتب الرسالة وكلمة السر'; return; }
    $('sErr').textContent = ''; $('mk').disabled = true;
    try{
      const ct = await encrypt(JSON.stringify({r:$('sR').value.trim(), m, s:$('sS').value.trim()}), p);
      link = $('sU').value.split('#')[0] + '#v1/' + CONFIG.accent.slice(1) + '/' + encodeURIComponent($('sH').value.trim()) + '/' + ct;
      $('lnk').value = link; $('res').hidden = false;
    }catch(e){ $('sErr').textContent = 'تعذر التشفير. افتح الصفحة عبر https'; }
    $('mk').disabled = false;
  };
  $('cp').onclick = async () => {
    try{ await navigator.clipboard.writeText(link); }catch(e){ $('lnk').select(); document.execCommand('copy'); }
    $('cp').textContent = 'تم النسخ'; setTimeout(() => $('cp').textContent = 'نسخ', 1500);
  };
  $('wa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent('رسالة لك: ' + link), '_blank');
  $('pv').onclick = () => window.open(link, '_blank');
}


/* بتلات متساقطة */
(function(){
  if(reduce) return;
  for(let i=0;i<16;i++){
    const d=document.createElement('div'), s=10+Math.random()*12;
    d.className='fall';
    d.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*1.3}px;animation-duration:${9+Math.random()*8}s;animation-delay:-${Math.random()*15}s;--sx:${Math.random()*160-80}px;--r:${Math.random()*720-360}deg`;
    d.innerHTML='<i class="pt"></i>';
    $('petals').appendChild(d);
  }
})();

/* فك التشفير: base64( salt16 | iv12 | ciphertext ) */
async function decrypt(pw){
  const b = Uint8Array.from(atob(CONFIG.cipher), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b.slice(0,16), iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b.slice(16,28)}, key, b.slice(28));
  return new TextDecoder().decode(pt);
}

/* إظهار/إخفاء */
$('eye').onclick = () => {
  const h = $('pw').type === 'password';
  $('pw').type = h ? 'text' : 'password';
  $('slash').style.display = h ? '' : 'none';
  $('eye').setAttribute('aria-label', h ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
};

/* المحاولات (في الذاكرة فقط) */
let fails = 0, lockTimer = null, plain = null;
function lockOut(){
  let left = 30;
  $('pw').disabled = $('go').disabled = true;
  const tick = () => {
    if(left <= 0){ clearInterval(lockTimer); fails = 0; $('pw').disabled = $('go').disabled = false; $('err').textContent = ''; $('pw').focus(); return; }
    $('err').textContent = `محاولات كثيرة. انتظر ${left} ثانية`; left--;
  };
  tick(); lockTimer = setInterval(tick, 1000);
}
async function submit(){
  const pw = $('pw').value;
  if(!pw || $('go').disabled) return;
  $('go').disabled = true; $('go').textContent = '...';
  try{
    const o = JSON.parse(await decrypt(pw)); plain = o.m; $('to').textContent = o.r; $('sig').textContent = o.s;
    $('pw').value = '';
    $('err').textContent = '';
    $('lock').classList.add('open');
    setTimeout(() => { $('lockStage').classList.remove('on'); $('envStage').classList.add('on'); $('scene').focus(); }, reduce ? 50 : 900);
  }catch(e){
    fails++;
    $('card').classList.remove('shake'); void $('card').offsetWidth; $('card').classList.add('shake');
    $('err').textContent = 'كلمة السر غير صحيحة';
    $('go').textContent = 'افتح'; $('go').disabled = false;
    if(fails >= 5) lockOut();
    return;
  }
  $('go').textContent = 'افتح';
}
$('go').onclick = submit;
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });

/* الظرف */
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.7 2.7 5 6.2 5c2.1 0 3.8 1.2 5.8 3.4C14 6.2 15.7 5 17.8 5c3.5 0 5.2 3.7 3.8 6.8C19.5 16.4 12 21 12 21z"/></svg>';
function burst(){
  if(reduce) return;
  const n = 12 + Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const el = document.createElement('div'), sz = 14 + Math.random()*24;
    el.className = 'bit'; el.style.width = sz+'px'; el.style.height = sz+'px';
    el.innerHTML = Math.random() < .35 ? HEART : '<i class="pt" style="display:block;width:100%;height:100%"></i>';
    $('fx').appendChild(el);
    const a = Math.random()*Math.PI*2, d = 110 + Math.random()*Math.min(innerWidth,520)*.6;
    el.animate([
      {transform:'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity:0},
      {opacity:1, offset:.15},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-90}px)) scale(1) rotate(${Math.random()*720-360}deg)`, opacity:0}
    ], {duration:2600+Math.random()*1800, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards'}).onfinish = () => el.remove();
  }
}
let busy = false;
function openEnvelope(){
  if(busy || plain === null) return; busy = true;
  const sc = $('scene'), t = reduce ? 0 : 1;
  $('tap').classList.add('gone');
  sc.classList.add('pulse');
  setTimeout(() => sc.classList.add('open'), 500*t);
  setTimeout(() => sc.classList.add('up'), 1350*t);
  setTimeout(() => {
    sc.classList.add('gone');
    const m = $('msg'); m.textContent = '';
    const lines = plain.split('\n');
    lines.forEach((ln, i) => { const d = document.createElement('div'); d.className = 'line'; d.style.setProperty('--i', i); d.textContent = ln; m.appendChild(d); });
    $('sig').style.setProperty('--n', lines.length);
    $('sheetWrap').classList.add('on');
    burst();
    $('close').focus({preventScroll:true});
  }, 2250*t);
}
$('scene').addEventListener('click', openEnvelope);
$('scene').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); } });

/* الإغلاق: يعيد الظرف مغلقاً */
function closeSheet(){
  $('sheetWrap').classList.remove('on');
  setTimeout(() => {
    const sc = $('scene'); sc.className = 'scene';
    $('tap').classList.remove('gone'); busy = false; sc.focus();
  }, 900);
}
$('close').onclick = closeSheet;
addEventListener('keydown', e => { if(e.key === 'Escape' && $('sheetWrap').classList.contains('on')) closeSheet(); });
</script>
</body>
